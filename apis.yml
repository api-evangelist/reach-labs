name: Reach Labs
description: >-
  Reach Labs (operating as Reach Power Inc.) is a wireless power transmission
  company that delivers electrical energy through the air without physical
  connections, describing its mission as "doing for power what Wi-Fi did for
  data." Its patented approach combines energy-transmission hardware, a custom
  delivery algorithm, and adaptive software controls to beam power to devices
  across varying distances and conditions. The company targets three primary
  sectors: defense and intelligence (powering sensors, autonomous vehicles, and
  drones in remote environments), manufacturing and logistics (energizing
  robotics and IoT devices in industrial settings), and public safety (enabling
  continuous drone operations for first responders). Reach was surfaced as a
  portfolio company of DCVC and added to the API Evangelist network. As of this
  enrichment pass the company publishes no public API, SDK, developer portal, or
  machine-readable metadata surface.
